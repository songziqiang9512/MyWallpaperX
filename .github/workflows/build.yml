name: Release MyWallpaperX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS app
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26

    env:
      APP_NAME: MyWallpaperX
      PROJECT_PATH: MyWallpaperX.xcodeproj
      SCHEME: MyWallpaperX
      CONFIGURATION: Release
      DERIVED_DATA_PATH: build/DerivedData
      DIST_DIR: dist
      KEYCHAIN_PATH: build/signing.keychain-db
      IS_RELEASE_BUILD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select repository Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests and check Swift file health
        env:
          BASE_REF: ${{ github.event.before }}
        run: |
          python3 -B script/run_scene_tests.py --scope all --jobs 4
          if [ -z "${BASE_REF}" ] || [[ "${BASE_REF}" =~ ^0+$ ]]; then
            BASE_REF="$(git tag --merged HEAD --list 'build-*' --sort=-version:refname | head -n 1)"
          fi
          if [ -z "${BASE_REF}" ]; then
            BASE_REF="$(git rev-list --max-parents=0 HEAD | head -n 1)"
          fi
          python3 script/check_code_health.py --check --base-ref "${BASE_REF}" --format github

      - name: Resolve build version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${IS_RELEASE_BUILD}" = "true" ]; then
            eval "$("$GITHUB_WORKSPACE/script/resolve_version.sh" --release)"
            git fetch --force --tags origin
            if git rev-parse -q --verify "refs/tags/build-${MARKETING_VERSION}" >/dev/null; then
              echo "::error::Release tag build-${MARKETING_VERSION} already exists. Bump the project version in a release PR before pushing main."
              exit 1
            fi
          else
            eval "$("$GITHUB_WORKSPACE/script/resolve_version.sh")"
          fi
          PACKAGE_NAME="${APP_NAME}-${MARKETING_VERSION}-${SHORT_SHA}"

          {
            echo "MARKETING_VERSION=${MARKETING_VERSION}"
            echo "BUILD_VERSION=${BUILD_VERSION}"
            echo "PACKAGE_NAME=${PACKAGE_NAME}"
          } >> "$GITHUB_ENV"

          echo "Building ${APP_NAME} ${MARKETING_VERSION} (${BUILD_VERSION})"

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate release signing secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=0
          for name in \
            BUILD_CERTIFICATE_BASE64 \
            P12_PASSWORD \
            KEYCHAIN_PASSWORD \
            DEVELOPER_ID_APPLICATION \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID \
            SPARKLE_PRIVATE_KEY
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"

          mkdir -p "$(dirname "$KEYCHAIN_PATH")"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Build app
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sign app
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/$APP_NAME.app"

          HELPER_PATH="$APP_PATH/Contents/Helpers/${APP_NAME}WallpaperDaemon"
          if [ -x "$HELPER_PATH" ]; then
            codesign \
              --force \
              --timestamp \
              --options runtime \
              --sign "$DEVELOPER_ID_APPLICATION" \
              "$HELPER_PATH"
          fi

          for code_path in \
            "$APP_PATH/Contents/Resources/SteamCMDRuntime.bundle/Steam/steamcmd" \
            "$APP_PATH/Contents/Resources/SteamCMDRuntime.bundle/Steam/libsteaminput.dylib" \
            "$APP_PATH/Contents/Resources/SteamCMDRuntime.bundle/Steam/Frameworks/Breakpad.framework/Versions/A/Resources/Inspector"
          do
            if [ -e "$code_path" ]; then
              codesign \
                --force \
                --timestamp \
                --options runtime \
                --preserve-metadata=identifier,entitlements,flags \
                --sign "$DEVELOPER_ID_APPLICATION" \
                "$code_path"
            fi
          done

          while IFS= read -r bundle_path; do
            codesign \
              --force \
              --timestamp \
              --deep \
              --options runtime \
              --sign "$DEVELOPER_ID_APPLICATION" \
              "$bundle_path"
          done < <(find "$APP_PATH" -mindepth 1 -type d \( -name '*.app' -o -name '*.framework' \) | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2-)

          codesign \
            --force \
            --timestamp \
            --deep \
            --options runtime \
            --sign "$DEVELOPER_ID_APPLICATION" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package app
        run: |
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/$APP_NAME.app"
          mkdir -p "$DIST_DIR"
          ditto -c -k --keepParent "$APP_PATH" "$DIST_DIR/$PACKAGE_NAME.zip"

      - name: Notarize app package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ZIP_PATH="$DIST_DIR/$PACKAGE_NAME.zip"
          SUBMISSION_JSON="$RUNNER_TEMP/notary-submit.json"

          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee "$SUBMISSION_JSON"

          SUBMISSION_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$SUBMISSION_JSON")"
          SUBMISSION_STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$SUBMISSION_JSON")"

          if [ "$SUBMISSION_STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $SUBMISSION_STATUS"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

      - name: Staple notarization ticket
        run: |
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/$APP_NAME.app"

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Create signed DMG
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/$APP_NAME.app"
          DMG_ROOT="$RUNNER_TEMP/dmg-root"
          DMG_PATH="$DIST_DIR/$PACKAGE_NAME.dmg"

          rm -rf "$DMG_ROOT" "$DMG_PATH"
          mkdir -p "$DMG_ROOT"
          cp -R "$APP_PATH" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          codesign \
            --force \
            --timestamp \
            --sign "$DEVELOPER_ID_APPLICATION" \
            "$DMG_PATH"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="$DIST_DIR/$PACKAGE_NAME.dmg"
          SUBMISSION_JSON="$RUNNER_TEMP/notary-dmg-submit.json"

          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee "$SUBMISSION_JSON"

          SUBMISSION_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$SUBMISSION_JSON")"
          SUBMISSION_STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$SUBMISSION_JSON")"

          if [ "$SUBMISSION_STATUS" != "Accepted" ]; then
            echo "::error::DMG notarization failed with status: $SUBMISSION_STATUS"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

      - name: Staple DMG
        run: |
          DMG_PATH="$DIST_DIR/$PACKAGE_NAME.dmg"

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Upload build package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.DIST_DIR }}/*.dmg
          if-no-files-found: error

      - name: Generate release notes
        if: env.IS_RELEASE_BUILD == 'true'
        run: |
          PREVIOUS_TAG="$(git tag --list 'build-*' --sort=-v:refname | head -n 1)"
          NOTES_FILE="$DIST_DIR/release-notes.md"

          {
            echo "Automated build for ${GITHUB_SHA}."
            echo
            echo "Version: ${MARKETING_VERSION} (${BUILD_VERSION})"
            echo
            echo "Changes:"
            if [ -n "$PREVIOUS_TAG" ]; then
              git log "${PREVIOUS_TAG}..HEAD" --pretty='- %s (%h)'
            else
              git log --pretty='- %s (%h)' -n 20
            fi
          } > "$NOTES_FILE"

      - name: Publish GitHub prerelease
        if: env.IS_RELEASE_BUILD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="build-${MARKETING_VERSION}"
          RELEASE_TITLE="${APP_NAME} ${MARKETING_VERSION}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$DIST_DIR/$PACKAGE_NAME.dmg" --clobber
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file "$DIST_DIR/release-notes.md" \
              --prerelease
          else
            gh release create "$TAG_NAME" \
              "$DIST_DIR/$PACKAGE_NAME.dmg" \
              --title "$RELEASE_TITLE" \
              --notes-file "$DIST_DIR/release-notes.md" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

      - name: Generate signed Sparkle appcast
        if: env.IS_RELEASE_BUILD == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_VERSION="2.9.2"
          SPARKLE_DIR="$RUNNER_TEMP/sparkle"
          FEED_DIR="$RUNNER_TEMP/sparkle-feed"
          DOWNLOAD_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/build-${MARKETING_VERSION}/"

          rm -rf "$SPARKLE_DIR" "$FEED_DIR"
          mkdir -p "$SPARKLE_DIR" "$FEED_DIR"

          curl --fail --location --silent --show-error \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar -xJ -C "$SPARKLE_DIR"

          cp "$DIST_DIR/$PACKAGE_NAME.dmg" "$FEED_DIR/"
          cp "$DIST_DIR/release-notes.md" "$FEED_DIR/$PACKAGE_NAME.md"

          printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | "$SPARKLE_DIR/bin/generate_appcast" \
                --ed-key-file - \
                --download-url-prefix "$DOWNLOAD_PREFIX" \
                --embed-release-notes \
                --maximum-versions 1 \
                --maximum-deltas 0 \
                --link "https://github.com/${GITHUB_REPOSITORY}" \
                -o "$DIST_DIR/appcast.xml" \
                "$FEED_DIR"

      - name: Publish Sparkle update feed
        if: env.IS_RELEASE_BUILD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FEED_TAG="update-feed"
          if gh release view "$FEED_TAG" >/dev/null 2>&1; then
            gh release upload "$FEED_TAG" "$DIST_DIR/appcast.xml" --clobber
          else
            gh release create "$FEED_TAG" \
              "$DIST_DIR/appcast.xml" \
              --title "MyWallpaperX Update Feed" \
              --notes "Machine-readable Sparkle update feed." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
