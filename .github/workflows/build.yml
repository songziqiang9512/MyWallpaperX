name: Release MyWallpaperX

on:
  workflow_dispatch:
    inputs:
      version:
        description: 已提交版本号（必须有 docs/releases/<version>.md）
        required: true
        type: string
      source_sha:
        description: Agent 校验的待发布提交 SHA
        required: true
        type: string
      test_scope:
        description: 发布核心检查；需要完整回归时显式选择 all
        required: true
        default: release
        type: choice
        options:
          - release
          - all

permissions:
  contents: write

concurrency:
  group: mywallpaperx-release
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS app
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    env:
      APP_NAME: MyWallpaperX
      PROJECT_PATH: MyWallpaperX.xcodeproj
      SCHEME: MyWallpaperX
      CONFIGURATION: Release
      DERIVED_DATA_PATH: build/DerivedData
      DIST_DIR: dist
      KEYCHAIN_PATH: build/signing.keychain-db

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select repository Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: script/requirements-tests.txt

      - name: Resolve build version
        run: bash script/resolve_version.sh --release >> "$GITHUB_ENV"

      - name: Validate version and authored release notes
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::main changed after preparation; refusing to publish a different commit."
            exit 1
          fi
          if [ "$REQUESTED_VERSION" != "$MARKETING_VERSION" ]; then
            echo "::error::Requested version must match the committed project version ($MARKETING_VERSION)."
            exit 1
          fi
          python3 script/validate_release_notes.py "$REQUESTED_VERSION" --check-project --check-tags
          gh release download update-feed --pattern appcast.xml --dir "$RUNNER_TEMP/previous-feed"
          python3 script/release_version.py --previous-appcast "$RUNNER_TEMP/previous-feed/appcast.xml"
          if gh release view "build-$MARKETING_VERSION" >/dev/null 2>&1; then
            echo "::error::Release or draft already exists; inspect it before retrying."
            exit 1
          fi
          mkdir -p "$DIST_DIR"
          cp "docs/releases/$MARKETING_VERSION.md" "$DIST_DIR/release-notes.md"
          echo "PACKAGE_NAME=${APP_NAME}-${MARKETING_VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Select SteamService SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.401"
          cache: true
          cache-dependency-path: SteamService/packages.lock.json

      - name: Prepare test dependencies
        run: python3 -m pip install -r script/requirements-tests.txt

      - name: Restore locked SteamService dependencies
        working-directory: SteamService
        run: dotnet restore --locked-mode

      - name: Run tests and check Swift file health
        env:
          BASE_REF: ${{ github.event.before }}
          TEST_SCOPE: ${{ inputs.test_scope }}
        run: |
          python3 -B script/run_scene_tests.py --scope "$TEST_SCOPE" --jobs 4 --fail-fast
          if [ -z "${BASE_REF}" ] || [[ "${BASE_REF}" =~ ^0+$ ]]; then
            BASE_REF="$(git tag --merged HEAD --list 'build-*' --sort=-version:refname | head -n 1)"
          fi
          if [ -z "${BASE_REF}" ]; then
            BASE_REF="$(git rev-list --max-parents=0 HEAD | head -n 1)"
          fi
          python3 script/check_code_health.py --check --base-ref "${BASE_REF}" --format github

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate release signing secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=0
          for name in \
            BUILD_CERTIFICATE_BASE64 \
            P12_PASSWORD \
            KEYCHAIN_PASSWORD \
            DEVELOPER_ID_APPLICATION \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID \
            SPARKLE_PRIVATE_KEY
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"

          mkdir -p "$(dirname "$KEYCHAIN_PATH")"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Build app
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Validate Apple Silicon release contract
        run: |
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/$APP_NAME.app"
          python3 script/validate_apple_silicon_release.py \
            --project "$PROJECT_PATH" \
            --app "$APP_PATH" --skip-codesign
          python3 script/release_version.py --app "$APP_PATH"

      - name: Sign app
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/$APP_NAME.app"

          /bin/bash script/sign-steam-helper.sh "$APP_PATH/Contents/Resources/SteamService" "$DEVELOPER_ID_APPLICATION"

          codesign --force --timestamp --options runtime \
            --sign "$DEVELOPER_ID_APPLICATION" "$APP_PATH/Contents/Resources/SceneMediaObserver/SceneMediaObserver.dylib"

          for helper in "${APP_NAME}WallpaperDaemon" glslang spirv-cross; do
            codesign --force --timestamp --options runtime \
              --sign "$DEVELOPER_ID_APPLICATION" "$APP_PATH/Contents/Helpers/$helper"
          done

          # Sign Sparkle inside-out; Downloader must retain its sandbox entitlement.
          SPARKLE_FRAMEWORK="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          SPARKLE_VERSION_DIR="$SPARKLE_FRAMEWORK/Versions/B"
          for nested in XPCServices/Installer.xpc XPCServices/Downloader.xpc Autoupdate Updater.app; do
            codesign --force --timestamp --options runtime --preserve-metadata=entitlements \
              --sign "$DEVELOPER_ID_APPLICATION" "$SPARKLE_VERSION_DIR/$nested"
          done
          codesign --force --timestamp --options runtime \
            --sign "$DEVELOPER_ID_APPLICATION" "$SPARKLE_FRAMEWORK"

          codesign \
            --force \
            --timestamp \
            --options runtime \
            --sign "$DEVELOPER_ID_APPLICATION" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package app
        run: |
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/$APP_NAME.app"
          mkdir -p "$DIST_DIR"
          ditto -c -k --keepParent "$APP_PATH" "$DIST_DIR/$PACKAGE_NAME.zip"

      - name: Notarize app package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ZIP_PATH="$DIST_DIR/$PACKAGE_NAME.zip"
          SUBMISSION_JSON="$RUNNER_TEMP/notary-submit.json"

          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee "$SUBMISSION_JSON"

          SUBMISSION_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$SUBMISSION_JSON")"
          SUBMISSION_STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$SUBMISSION_JSON")"

          if [ "$SUBMISSION_STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $SUBMISSION_STATUS"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

      - name: Staple notarization ticket
        run: |
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/$APP_NAME.app"

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Create signed DMG
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/$APP_NAME.app"
          DMG_ROOT="$RUNNER_TEMP/dmg-root"
          DMG_PATH="$DIST_DIR/$PACKAGE_NAME.dmg"

          rm -rf "$DMG_ROOT" "$DMG_PATH"
          mkdir -p "$DMG_ROOT"
          ditto "$APP_PATH" "$DMG_ROOT/$APP_NAME.app"
          ln -s /Applications "$DMG_ROOT/Applications"

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          codesign \
            --force \
            --timestamp \
            --sign "$DEVELOPER_ID_APPLICATION" \
            "$DMG_PATH"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="$DIST_DIR/$PACKAGE_NAME.dmg"
          SUBMISSION_JSON="$RUNNER_TEMP/notary-dmg-submit.json"

          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee "$SUBMISSION_JSON"

          SUBMISSION_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$SUBMISSION_JSON")"
          SUBMISSION_STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$SUBMISSION_JSON")"

          if [ "$SUBMISSION_STATUS" != "Accepted" ]; then
            echo "::error::DMG notarization failed with status: $SUBMISSION_STATUS"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

      - name: Staple DMG
        run: |
          DMG_PATH="$DIST_DIR/$PACKAGE_NAME.dmg"

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --strict "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_VERSION="2.9.2"
          SPARKLE_DIR="$RUNNER_TEMP/sparkle"
          FEED_DIR="$RUNNER_TEMP/sparkle-feed"
          DOWNLOAD_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/build-${MARKETING_VERSION}/"

          rm -rf "$SPARKLE_DIR" "$FEED_DIR"
          mkdir -p "$SPARKLE_DIR" "$FEED_DIR"

          curl --fail --location --silent --show-error \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar -xJ -C "$SPARKLE_DIR"

          cp "$DIST_DIR/$PACKAGE_NAME.dmg" "$FEED_DIR/"
          cp "$DIST_DIR/release-notes.md" "$FEED_DIR/$PACKAGE_NAME.md"

          printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | "$SPARKLE_DIR/bin/generate_appcast" \
                --ed-key-file - \
                --download-url-prefix "$DOWNLOAD_PREFIX" \
                --embed-release-notes \
                --maximum-versions 1 \
                --maximum-deltas 0 \
                --link "https://github.com/${GITHUB_REPOSITORY}" \
                -o "$DIST_DIR/appcast.xml" \
                "$FEED_DIR"
          python3 script/release_version.py --appcast "$DIST_DIR/appcast.xml"

      - name: Archive release artifacts
        run: |
          (cd "$DIST_DIR" && shasum -a 256 "$PACKAGE_NAME.dmg" > "$PACKAGE_NAME.dmg.sha256")
          DSYM_PATH="$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/$APP_NAME.app.dSYM"
          ditto -c -k --keepParent "$DSYM_PATH" "$DIST_DIR/$PACKAGE_NAME.dSYM.zip"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.DIST_DIR }}/*.dmg
            ${{ env.DIST_DIR }}/*.sha256
            ${{ env.DIST_DIR }}/*.dSYM.zip
            ${{ env.DIST_DIR }}/appcast.xml
            ${{ env.DIST_DIR }}/release-notes.md
          if-no-files-found: error

      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="build-${MARKETING_VERSION}"
          # Upload everything to a draft before making the release public.
          gh release create "$TAG_NAME" \
            "$DIST_DIR/$PACKAGE_NAME.dmg" \
            "$DIST_DIR/$PACKAGE_NAME.dmg.sha256" \
            "$DIST_DIR/$PACKAGE_NAME.dSYM.zip" \
            "$DIST_DIR/appcast.xml" \
            --title "${APP_NAME} ${MARKETING_VERSION}" \
            --notes-file "$DIST_DIR/release-notes.md" \
            --draft --target "$GITHUB_SHA"
          gh release edit "$TAG_NAME" --draft=false --prerelease=false --latest

      - name: Publish Sparkle update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FEED_TAG="update-feed"
          if gh release view "$FEED_TAG" >/dev/null 2>&1; then
            gh release upload "$FEED_TAG" "$DIST_DIR/appcast.xml" --clobber
          else
            gh release create "$FEED_TAG" \
              "$DIST_DIR/appcast.xml" \
              --title "MyWallpaperX Update Feed" \
              --notes "Machine-readable Sparkle update feed." \
              --prerelease --latest=false \
              --target "$GITHUB_SHA"
          fi

      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
