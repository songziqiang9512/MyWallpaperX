name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Compare against this commit (defaults to the previous commit)
        required: false
        type: string
      test_scope:
        description: 按改动验证、发布核心检查或完整回归（均不发布）
        required: true
        default: changed
        type: choice
        options:
          - changed
          - release
          - all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Select and run repository gates
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select SteamService SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.401"
          cache: true
          cache-dependency-path: SteamService/packages.lock.json

      - name: Select repository Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: script/requirements-tests.txt

      - name: Prepare test dependencies
        run: python3 -m pip install -r script/requirements-tests.txt

      - name: Restore locked SteamService dependencies
        working-directory: SteamService
        run: dotnet restore --locked-mode

      - name: Resolve validation range
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_BASE: ${{ inputs.base_ref }}
        run: |
          echo "CLANG_MODULE_CACHE_PATH=$RUNNER_TEMP/mwx-clang-module-cache" >> "$GITHUB_ENV"
          echo "SWIFT_MODULECACHE_PATH=$RUNNER_TEMP/mwx-swift-module-cache" >> "$GITHUB_ENV"
          BASE_REF="$EVENT_BEFORE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_REF="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BASE_REF="${REQUESTED_BASE:-HEAD^}"
          fi
          if [ -z "$BASE_REF" ] || [[ "$BASE_REF" =~ ^0+$ ]]; then
            git fetch --no-tags origin main
            BASE_REF="$(git merge-base HEAD origin/main)"
          fi
          echo "BASE_REF=$BASE_REF" >> "$GITHUB_ENV"

      - name: Run selected gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TEST_SCOPE: ${{ inputs.test_scope || 'changed' }}
        run: |
          PHASE=checkpoint
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$REF_NAME" = "main" ]; then
            PHASE=integration
          fi
          python3 script/verify_scene_change.py \
            --base "$BASE_REF" \
            --phase "$PHASE" \
            --test-scope "$TEST_SCOPE" \
            --ci \
            --skip-runtime \
            --reason "GitHub CI has no private isolated Workshop corpus" \
            --run
